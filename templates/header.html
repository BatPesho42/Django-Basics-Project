{% load static %}

<a href="{% url 'common:profile' %}"

   aria-label="Open placeholder profile and project statistics">

    <span class="placeholder-profile-copy">
        <span class="placeholder-greeting">Hello,</span>
        <span class="placeholder-name">Placeholder</span>
    </span>
    <span class="placeholder-chevron" aria-hidden="true">⌄</span>
</a>
