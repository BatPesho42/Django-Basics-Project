{% extends 'base.html' %}

{% block title %}Page not found | HomeBrew{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="error-code">404</div>
        <h1 class="h2 mt-3">This batch has gone missing</h1>
        <p class="text-secondary mx-auto mb-4" style="max-width: 480px;">
            The page you are looking for doesn't exist, or it was moved
            (or poured out). Let's get you back to something worth brewing.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a href="{% url 'common:home' %}" class="btn btn-brew-green px-4">Go home</a>
            <a href="{% url 'recipes:recipe-list' %}" class="btn btn-outline-dark">Browse recipes</a>
        </div>
    </div>
</div>
{% endblock %}
