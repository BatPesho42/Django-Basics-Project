{# Compact field used inside the ingredient rows. Expects `field` and `col` (Bootstrap column classes). #}
<div class="{{ col }} {% if field.errors %}has-error{% endif %}">
    <label for="{{ field.id_for_label }}" class="small fw-semibold mb-1">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}
        <div class="field-error">{{ error }}</div>
    {% endfor %}
</div>
